<!DOCTYPE html>
<html lang="en">
  <head>
    <title>View Timetable</title>
    <link rel="stylesheet" href="mva-assistant.css">
    <script src="mva-view-timetable.js" defer></script> 
  </head>
  <body>
    <section id="intro">
      <div>
      <h1>View Timetable</h1>
        <p>View your timetable and the tasks due.</p>
      </div>
    </section>
    <section id="filters">
      <div id="control-bar" class="card">
      </div>
    </section>
    <section id="weekA"></section>
    <div id="weekA-timetable" class="card">
      <h2>Week A Time Table</h2>
    </div>
    <section id="weekA-tasks"></section>
    <div id="weekA-tasks-due" class="card">
      <h2>Week A Tasks</h2>
    </div>
    <section id="weekB">
       <div id="weekB-timetable" class="card">
        <h2>Week B Time Table</h2>
       </div>
    </section>
    <section id="weekB-tasks">
      <div id="weekB-timetable" class="card">
       <h2>Week B Tasks</h2>
      </div>
    </section>
  </body>
