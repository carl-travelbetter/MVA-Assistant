<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Week A Tracker</title>
    <link rel="stylesheet" href="mva-assistant.css">
    <script src="week-a-tracker.js" defer></script> 
  </head>
  <body>
    <section id="intro">
      <div>
      <h1>Week A Tracker</h1>
        <p>Review and Tick Off Week A Tasks and Lessons</p>
        <P>Remainder - All Week A Tasks must be complete before Week B starts</P>
      </div>
    </section>
    <section id="filters">
      <div id="control-bar" class="card">
      </div>
    </section>
    <section id="double-lessons">
    <div id="double-lesson-tracker" class="card">
      <h2>Double Lessons</h2>
      <div id="a-double-to-do">
        <h3>To Do</h3>
      </div>
      <div id="a-double-next">
        <h3>Do Next</h3>
      </div>
      <div id="a-double-done">
        <h3>Done</h3>
      </div>
    </div>
    </section>
    <section id="single-lessons">
    <div id="single-lesson-tracker" class="card">
      <h2>Single Lessons</h2>
      <div id="a-single-to-do">
        <h3>To Do</h3>
        <div id="single-to-do-list" hidden></div>
        <button class="control-btn">Hide/View Tasks</button>
      </div>
      <div id="a-single-next">
        <h3>Do Next</h3>
      </div>
      <div id="a-single-done">
        <h3>Done</h3>
      </div>
    </div>
  </section>
  </body>
</html>
