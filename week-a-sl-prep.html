<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Week A Single Lesson Prep Tracker</title>
    <link rel="stylesheet" href="mva-assistant.css">
    <script src="week-a-prep-tracker.js" defer></script> 
  </head>
  <body>
    <section id="intro">
      <div>
      <h1>Week A Single Lesson Prep Tracker</h1>
        <p>Review and Tick Off Week A Single Lesson Prep Tasks</p>
      </div>
    </section>
    <section id="single-lessons">
    <div id="single-lesson-tracker" class="tracking-card">
      <h2>Single Lessons Prep Tasks</h2>
       <div id="next">
        <h3>Do This</h3>
         <div id="task"></div>
      </div>
      <div id="to-do" class="tracking-card">
        <h3>To Do</h3>
        <div id="count"></div>
        <div><button class="control-btn" onclick="showHideSLToDoList()">Hide/View To Do List</button></div>
        <div id="to-do-list"  hidden></div>
      </div>
      <div id="done" class="tracking-card">
        <h3>Done</h3>
        <div><button class="control-btn" onclick="showHideSLDoneList()">Hide/View Done List</button></div>
        <div id="done-list"  hidden></div>
      </div>
    </div>
  </section>
    <section id="nav">
      <a href="index.html">Start Menu</a>
    </section>
  </body>
</html>
