<!DOCTYPE html>
<html lang="en">
  <head>
    <title>MVA Assistant</title>
    <link rel="stylesheet" href="mva-assistant.css">
    <script src="mva-camera-on.js" defer></script>
  </head>
  <body>
    <section id="intro">
      <div class="intro">
        <h1>MVA Assistant - Camera Confidence</h1>
        <p>Build your camera on confidence</p>
      </div>
    </section>
    <section id="menu-section">
      <div id="menu" class="card">
        <h2>Camera On</h2>
        <div id="set-timer">
          <label for="time-input">Enter Time:</label>
            <input id="time-input" type="number" class="time"/>
        </div>
        <div id="timer">
          <button class="control-btn" onclick="startTimer()">Start Timer</button>
          <div id="clock"></div>
        </div>
      </div>
  </body>
