<!DOCTYPE html>
<html lang="en">
  <head>
    <title>MVA Assistant</title>
    <link rel="stylesheet" href="mva-assistant.css">
    <script src="mva-tracker.js" defer></script>
  </head>
  <body>
    <section id="intro">
      <h1>MVA Assistant - Submission Tracker</h1>
      <p>Track Prepare, Share, Submit, Develop and Build with ease</p>
    </section>
    <section id="tag-options">
      <button class="control-btn" onclick="showTags()">Open Filters</button>
      <div id="filter" hidden>
        <h2>Filters</h2>
        <div id="tag-filters" class="card"></div>
      </div>
    </section>
    <section id="tracking-section">
      <h2>Tracker</h2>
      <div id="tracking-card" class="tracking-card">
     
      </div>
    </section>
  </body>
