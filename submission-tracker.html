<!DOCTYPE html>
<html lang="en">
  <head>
    <title>MVA Assistant</title>
    <link rel="stylesheet" href="mva-assistant.css">
    <script src="mva-tracker.js" defer></script>
  </head>
  <body>
    <section id="intro">
      <h1>MVA Assistant - Submission Tracker</h1>
      <p>Track Prepare, Share, Submit, Develop and Build with ease</p>
    </section>
    <section id="controls">
      <div id="control-bar" class="card">
        <button class="control-btn" onclick="showTags()">Show Filters</button>
      </div>
    <section id="tag-options" hidden>
      <h2>Filters</h2>
      <div id="tag-filters" class="card"></div>
      <button class="control-btn" onclick="showTags()">Show Filters</button>
    </section>
    <section id="tracking-section" hidden>
      <h2>Tracker</h2>
      <div id="tracking-card" class="tracking-card">
        <div id="weekA">
          <h2>Week A</h2>
          <div id="week-a-subjects"></div>
        </div>
        <div id="weekB">
          <h2>Week B</h2>
          <div id="week-b-subjects"></div>
        </div> 
      </div>
    </section>
  </body>
