<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Week B Tracker</title>
    <link rel="stylesheet" href="mva-assistant.css">
    <script src="week-b-tracker.js" defer></script> 
  </head>
  <body>
    <section id="intro">
      <div>
      <h1>Week B Tracker</h1>
        <p>Review and Tick Off Week B Tasks and Lessons</p>
        <p>Reminder - all Week B tasks need to be completed before Week A Starts</p>
      </div>
    </section>
    <section id="filters">
      <div id="control-bar" class="card">
      </div>
    </section>
    <section id="double-lessons">
    <div id="double-lesson-tracker" class="card">
      <div id="b-double-to-do">
        <h2>To Do</h2>
      </div>
      <div id="b-double-done">
        <h2>Done</h2>
      </div>
    </div>
    </section>
    <section id="single-lessons">
    <div id="single-lesson-tracker" class="card">
      <div id="b-single-to-do">
        <h2>To Do</h2>
      </div>
      <div id="b-single-done">
        <h2>Done</h2>
      </div>
    </div>
  </section>
  </body>
</html>
