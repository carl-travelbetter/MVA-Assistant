<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Week A Single Lesson Build Tracker</title>
    <link rel="stylesheet" href="mva-assistant.css">
    <script src="week-a-build-tracker.js" defer></script> 
  </head>
  <body>
    <div class="mva-navbar">
    <ul>
      <li><a href="index.html">Home</a></li>
    </ul>
   </div>
    <section id="intro">
      <div class="intro">
      <h1>Week A Single Lesson Build Tracker</h1>
        <p>Review and Tick Off Week A Single Lesson Build Tasks</p>
      </div>
    </section>
    <section id="single-lessons">
      <div class="tracking-card" id="reset" hidden><button class="control-btn" onclick="resetWeek()">Reset Week</button></div>
    <div id="single-lesson-tracker" class="tracking-card">
      <h2>Single Lessons Build Tasks</h2>
       <div id="getNext">
         <button class="control-btn" onclick="getNextTask()">Get Next</button>
       </div>
       <div id="next" hidden>
        <h3>Do This</h3>
         <div id="task"></div>
      </div>
      <div id="to-do" class="tracking-card">
        <h3>To Do</h3>
        <div id="count"></div>
        <div><button class="control-btn" onclick="showHideSLToDoList()">Hide/View To Do List</button></div>
        <div id="to-do-list"  hidden></div>
      </div>
      <div id="done" class="tracking-card">
        <h3>Done</h3>
        <div><button class="control-btn" onclick="showHideSLDoneList()">Hide/View Done List</button></div>
        <div id="done-list"  hidden></div>
      </div>
    </div>
  </section>
  </body>
</html>
